            - generic [ref=e701]:
              - paragraph [ref=e702]: Research Article
              - heading "Ứng dụng RAG trong giáo dục" [level=1] [ref=e703]
              - paragraph [ref=e704]: Nguyễn Văn A · PaperAI Research Assistant · 23/9/2026
              - generic [ref=e705]:
                - heading "Abstract" [level=2] [ref=e706]
                - paragraph [ref=e707]:
                  - text: Bài báo này trình bày một nghiên cứu về việc ứng dụng kỹ thuật Retrieval-Augmented Generation (RAG) nhằm nâng cao chất lượng phản hồi trong các hệ thống chăm sóc khách hàng dựa trên mô hình ngôn ngữ lớn. Thông qua khảo sát 8 nguồn tài liệu học thuật, nghiên cứu phân tích kiến trúc hệ thống, đánh giá hiệu năng và đề xuất hướng ứng dụng thực tế
                  - superscript [ref=e708] [cursor=pointer]: "[1]"
                  - superscript [ref=e709] [cursor=pointer]: "[2]"
                  - text: .
                - paragraph [ref=e710]:
                  - strong [ref=e711]: "Keywords:"
                  - text: RAG, Large Language Model, Customer Service, Semantic Retrieval, AI Application
              - generic [ref=e712]:
                - heading "1. Introduction" [level=2] [ref=e713]
                - paragraph [ref=e714]:
                  - text: Trong những năm gần đây, các mô hình ngôn ngữ lớn (LLM) đã được ứng dụng rộng rãi trong nhiều lĩnh vực, đặc biệt là chăm sóc khách hàng. Tuy nhiên, các mô hình này thường gặp hạn chế về tính cập nhật và độ chính xác khi trả lời các câu hỏi mang tính chuyên biệt
                  - superscript [ref=e715] [cursor=pointer]: "[3]"
                  - text: . Kỹ thuật Retrieval-Augmented Generation (RAG) ra đời nhằm giải quyết vấn đề này bằng cách kết hợp khả năng truy xuất thông tin từ kho dữ liệu bên ngoài với khả năng sinh văn bản của LLM
                  - superscript [ref=e716] [cursor=pointer]: "[1]"
                  - text: .
                - paragraph [ref=e717]: Nghiên cứu này tập trung phân tích cách RAG được triển khai trong hệ thống chăm sóc khách hàng, đánh giá hiệu năng thực tế và đề xuất các hướng cải tiến dựa trên tổng hợp từ 8 nguồn tài liệu học thuật đã được lựa chọn.
              - generic [ref=e718]:
                - heading "2. Related Work" [level=2] [ref=e719]
                - paragraph [ref=e720]:
                  - text: Nhiều nghiên cứu trước đây đã chỉ ra rằng việc kết hợp truy xuất thông tin với mô hình sinh văn bản giúp cải thiện đáng kể độ chính xác của câu trả lời trong các tác vụ đòi hỏi tri thức chuyên sâu
                  - superscript [ref=e721] [cursor=pointer]: "[2]"
                  - text: . Các chiến lược truy xuất lai (hybrid retrieval) cũng được đề xuất nhằm tối ưu hoá độ liên quan của thông tin được truy xuất trong môi trường doanh nghiệp
                  - superscript [ref=e722] [cursor=pointer]: "[5]"
                  - text: .
                - paragraph [ref=e723]:
                  - text: Bên cạnh đó, các nghiên cứu về cơ sở dữ liệu vector và tìm kiếm ngữ nghĩa đã cung cấp nền tảng kỹ thuật quan trọng cho việc xây dựng các hệ thống truy xuất hiệu quả ở quy mô lớn
                  - superscript [ref=e724] [cursor=pointer]: "[6]"
                  - text: .
              - generic [ref=e725]:
                - heading "3. Methodology" [level=2] [ref=e726]
                - paragraph [ref=e727]: Nghiên cứu áp dụng phương pháp phân tích tổng hợp (systematic review) kết hợp với đánh giá thực nghiệm trên các hệ thống RAG hiện có. Dữ liệu được thu thập từ 8 bài báo học thuật được lựa chọn dựa trên mức độ liên quan và số lượng trích dẫn.
                - paragraph [ref=e728]: "Quy trình đánh giá bao gồm ba giai đoạn: (1) phân tích kiến trúc hệ thống, (2) đo lường các chỉ số hiệu năng như độ trễ và độ chính xác, và (3) tổng hợp các phát hiện thành khuyến nghị ứng dụng thực tế."
              - generic [ref=e729]:
                - heading "4. Experimental Setup" [level=2] [ref=e730]
                - paragraph [ref=e731]:
                  - text: Các hệ thống được khảo sát sử dụng kiến trúc truy xuất kết hợp sinh văn bản với cơ sở dữ liệu vector để lưu trữ và tìm kiếm ngữ nghĩa. Việc đánh giá được thực hiện trên các bộ dữ liệu mô phỏng tình huống hỗ trợ khách hàng thực tế, nhằm phản ánh chính xác điều kiện triển khai trong doanh nghiệp
                  - superscript [ref=e732] [cursor=pointer]: "[4]"
                  - text: .
              - generic [ref=e733]:
                - heading "5. Results" [level=2] [ref=e734]
                - paragraph [ref=e735]:
                  - text: Kết quả tổng hợp cho thấy các hệ thống ứng dụng RAG có độ chính xác phản hồi cao hơn đáng kể so với các mô hình sinh văn bản thuần tuý, đồng thời giảm thiểu hiện tượng "hallucination" — hiện tượng mô hình tạo ra thông tin không chính xác
                  - superscript [ref=e736] [cursor=pointer]: "[1]"
                  - text: . Tuy nhiên, chi phí suy luận và độ trễ tăng lên do bước truy xuất bổ sung
                  - superscript [ref=e737] [cursor=pointer]: "[1]"
                  - text: .
                - paragraph [ref=e738]:
                  - text: Về mặt trải nghiệm người dùng, các nghiên cứu ghi nhận mức độ hài lòng cao hơn khi hệ thống có khả năng trích dẫn nguồn thông tin rõ ràng trong phản hồi
                  - superscript [ref=e739] [cursor=pointer]: "[7]"
                  - text: .
