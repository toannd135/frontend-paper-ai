              - generic [ref=e782]:
                - heading "6. Discussion" [level=2] [ref=e783]
                - paragraph [ref=e784]:
                  - text: Những phát hiện trên cho thấy RAG là một hướng tiếp cận khả thi để nâng cao chất lượng hệ thống chăm sóc khách hàng dựa trên AI, đặc biệt trong bối cảnh doanh nghiệp cần cập nhật thông tin liên tục mà không muốn huấn luyện lại toàn bộ mô hình
                  - superscript [ref=e785] [cursor=pointer]: "[8]"
                  - text: . Tuy nhiên, việc cân bằng giữa chi phí, độ trễ và độ chính xác vẫn là một thách thức cần được nghiên cứu thêm.
              - generic [ref=e786]:
                - heading "7. Conclusion" [level=2] [ref=e787]
                - paragraph [ref=e788]: Nghiên cứu đã tổng hợp và phân tích các ứng dụng của kỹ thuật RAG trong hệ thống chăm sóc khách hàng dựa trên 8 nguồn tài liệu học thuật. Kết quả cho thấy tiềm năng lớn của phương pháp này trong việc cải thiện độ chính xác và độ tin cậy của các hệ thống hỗ trợ tự động, đồng thời gợi mở các hướng nghiên cứu tiếp theo liên quan đến tối ưu hoá chi phí và độ trễ trong triển khai thực tế.
